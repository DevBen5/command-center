# =============================================================================
# Les cinq gates du dépôt, en workflow RÉUTILISABLE (CC-149, extrait par CC-142).
#
# Ce fichier ne se déclenche jamais seul : `on: workflow_call` le rend appelable, et
# rien d'autre. Deux appelants aujourd'hui, et c'est la raison de l'extraction :
#   - `ci.yml`     — sur push vers master et sur toute PR qui la vise (la garde) ;
#   - `release.yml` — sur tag, AVANT de publier l'image (le portail).
#
# ⚠️ **Pourquoi extrait plutôt que recopié.** La publication n'avait que deux autres
# options, mauvaises toutes deux : ne pas rejouer les gates (publier une image dont
# rien ne dit qu'elle passe), ou en recopier les étapes dans `release.yml` (deux
# sources de vérité qui divergent en silence — exactement ce que ce dépôt ferme
# partout ailleurs). Une seule définition, deux appels.
#
# ⚠️ CE QUE CES GATES N'ATTRAPENT PAS, et ça se lit avant de se fier au vert. Aucun
#    des problèmes qui ont réellement mordu ce projet ne serait tombé dans ce filet :
#      - le passage navigateur — jsdom ne fait aucun layout, et `curl` n'y substitue
#        rien (CC-136 : un cookie `Secure` réexpédié sur http://localhost sans refus) ;
#      - la divergence entre `app` et `app_test` — la suite migre `app_test` à neuf et
#        ne dit RIEN du schéma de la base de dev (point 2 des « choses qui cassent
#        sans lever d'erreur » du CLAUDE.md racine) ;
#      - l'apparence : une couleur, une icône fausse, un alignement ;
#      - une classe Tailwind qui ne produit aucun CSS — le build réussit dans les deux
#        cas, Tailwind émet ce qu'il trouve ; le remède reste de grepper le `.css`
#        produit, ce que l'étape `build` ne fait pas (CC-155) ;
#      - une page Inertia mal nommée — le nom est résolu AU RUNTIME contre un
#        `import.meta.glob` (`inertia/app/app.ts`) ; la chaîne écrite côté serveur,
#        Vite ne la voit jamais (CC-155) ;
#      - l'exécution de l'image sur une autre architecture que celle du runner
#        (CC-142) — ni ce job ni aucun autre ne fait tourner l'application sur du
#        vrai matériel arm64 ;
#      - une phrase fausse dans un message de commit.
#    Un badge vert de plus est exactement la fausse confiance que le CLAUDE.md racine
#    passe son temps à démonter. Ces gates se vendent pour ce qu'elles font — pas
#    comme une preuve que le lot est bon.
#
# ⚠️ Si le job rougit APRÈS avoir affiché `PASSED` : la cause n'est pas dans les tests.
#    C'est `@swc/core` ré-épinglé en version exacte — `npm test` sort alors en code 1
#    en affichant `PASSED`. Range `^1.15.43` ; ne ré-épingle pas pour faire taire le rouge.
#
# Périmètre : aucune publication, aucune image, aucun secret, aucune écriture. La
# construction et la publication de l'image vivent dans `release.yml`.
# =============================================================================
name: gates

on:
  workflow_call:

jobs:
  gates:
    name: typecheck · lint · build · Japa · Vitest
    runs-on: ubuntu-latest

    # Rien à écrire nulle part : la lecture du dépôt suffit.
    permissions:
      contents: read

    # ⚠️ `adonisrc.ts` pose `forceExit: false` : un handle resté ouvert fait PENDRE le
    # process au lieu de le terminer. Sans cette borne, le défaut de GitHub est de
    # 360 minutes, consommées en silence par un run coincé.
    timeout-minutes: 20

    services:
      postgres:
        # La même version majeure que `docker-compose.yml:3` : Japa migre une vraie base.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          # Crée directement la base des tests. `docker/init-db.sql` n'a pas d'équivalent
          # ici et n'en a pas besoin : il n'existe aucune base `app` sur un runner.
          POSTGRES_DB: app_test
        ports:
          - '5432:5432'
        # Les étapes ne démarrent qu'une fois le service sain, sinon la migration de Japa
        # partirait sur un Postgres qui n'écoute pas encore.
        options: >-
          --health-cmd "pg_isready -U root -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # ⚠️ EN CLAIR, et surtout PAS dans des secrets GitHub. Ce sont les coordonnées d'une
    # base jetable qui vit trois minutes dans un conteneur du runner : les ranger comme
    # des secrets donnerait l'illusion qu'il y a quelque chose à protéger, et rendrait la
    # CI illisible pour qui la reprend. Valeurs reprises telles quelles de `.env.example`.
    #
    # ⚠️ Ne pose ICI que ce que `.env.test` ne fournit pas — le reste vient du fichier
    # versionné, qui fait foi :
    #   - `DB_DATABASE` vient de `.env.test:3` (app_test), et c'est la seule chose qui
    #     isole les tests de la base de dev ;
    #   - `MODULES` vient de `.env.test:22` et doit rester COMPLET : un MODULES réduit
    #     ferait passer la suite au vert en n'exécutant plus la moitié du dépôt — le mode
    #     d'échec « garde qui naît inerte » (CC-112, CC-113). `modules_config.spec.ts`
    #     rougit si un module y manque ;
    #   - `NODE_ENV` est posée par `node ace test` lui-même ;
    #   - `TZ` n'est PAS posée : le runner est en UTC, ce qui est déjà la valeur de
    #     `.env.example:1` et le défaut de `node:22-alpine`. La poser masquerait une
    #     dépendance au poste au lieu de la révéler.
    # Et surtout pas de valeurs vides pour Immich / YouTube / LLM « au cas où » : elles
    # ne feraient rien. L'isolation vit dans `config/env_isolation.ts`.
    env:
      # Valeur de test, sans le moindre rapport avec l'APP_KEY d'un déploiement. Le dépôt
      # est public, donc ces logs le sont aussi : rien de ce bloc ne protège quoi que ce soit.
      APP_KEY: ci-only-not-a-secret-0123456789
      LOG_LEVEL: info
      DB_HOST: 127.0.0.1
      # Entre guillemets : YAML lirait `5432` comme un entier, et une valeur d'`env:`
      # doit être une chaîne.
      DB_PORT: '5432'
      DB_USER: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v5

      # Le générateur de vignettes NAS du coffre (CC-228) invoque `execFile('magick', …)` —
      # le nom qu'Alpine (l'image de production, `Dockerfile`) fournit sous IM7. Le paquet
      # `imagemagick` d'Ubuntu 24.04 (le runner) n'installe que IM6, sans binaire `magick` du
      # tout — seulement `convert`/`identify`. Sans ce lien, chaque test qui décode une image
      # échouerait en CI avec `spawn magick ENOENT`, alors que la même commande tourne sur le
      # poste de dev (IM7 via `winget`) et en production (IM7 via `apk`).
      #
      # ⚠️ **Un lien, pas un second code de génération.** La syntaxe positionnelle utilisée par
      # `nas_thumbnail_generator.ts` (`FORMAT:chemin[0] -ops FORMAT:-`, sans sous-commande) est
      # identique entre le mode legacy `convert` d'IM6 et le binaire `magick` d'IM7 — seul le
      # NOM du binaire diffère. Faire suivre `magick` vers `convert` ici teste donc le même
      # comportement applicatif, pas un chemin de code différent réservé à la CI.
      - name: system deps (ImageMagick, coffre NAS thumbnails)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick libheif-plugin-libde265
          sudo ln -s "$(command -v convert)" /usr/local/bin/magick

      - uses: actions/setup-node@v5
        with:
          # Suit l'image de production (`Dockerfile` — node:22-alpine) : c'est la CI qui
          # suit l'image, jamais l'inverse. `package.json` n'a pas de champ `engines` et
          # n'en gagne pas un ici, ce serait une seconde source de vérité.
          node-version: '22'
          cache: npm

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      # ⚠️ `eslint .` SEUL — volontairement pas de `prettier --check`. Quinze fichiers .vue
      # sont hors format Prettier dans master (dette connue) : la CI naîtrait rouge sur une
      # dette sans rapport avec elle. Le format est un autre ticket.
      - name: lint
        run: npm run lint

      # CC-155 — le seul gate qui compile le front end. `tsconfig.json` exclut
      # `./inertia/**/*` en entier et `vue-shim.d.ts` type les `.vue` en `any` : le
      # typecheck ci-dessus ne les voit pas. Douze fichiers de spec Vitest pour
      # vingt-huit `.vue` : la majorité des composants n'est montée par aucun test.
      # Sans cette étape, une erreur de syntaxe dans un SFC non testé, un import
      # cassé sous `inertia/`, une config Vite ou Tailwind invalide passaient tous
      # les gates au vert — le premier à s'en apercevoir aurait été `docker build`
      # au déploiement, ou personne.
      #
      # ⚠️ Ça reste un cran, pas une couverture : ça ne prouve NI une page Inertia
      # mal nommée, NI une classe Tailwind morte — voir la liste en tête du fichier.
      - name: build
        run: npm run build

      # ⚠️ Les deux suites en DEUX étapes, là où `npm test` les enchaîne par `&&`.
      # Sémantique identique — l'échec de la première empêche la seconde et rend le job
      # rouge — mais l'UI affiche alors deux verdicts distincts : on VOIT que Vitest a
      # tourné. Avec la commande composée, seule la sortie de Japa s'affiche, et rien ne
      # distingue « Vitest a passé » de « Vitest n'a jamais démarré ».
      - name: tests back (Japa)
        run: npm run test:back

      - name: tests front (Vitest)
        run: npm run test:front
