# =============================================================================
# Command Center — compose de PRODUCTION (NAS).
#
# Différences DÉLIBÉRÉES avec docker-compose.yml (dev), et pourquoi :
#   - PAS d'Adminer : c'est un accès lecture ET écriture complet à la base qui
#     porte l'unique exemplaire du contenu. Absent, pas seulement derrière un profil.
#   - Postgres ne publie AUCUN port : seul le réseau du compose le joint. Publier
#     5433 l'offrirait à tout le réseau local du NAS.
#   - PAS de montage de /var/run/docker.sock : ce serait l'équivalent de root sur
#     le NAS, cumulé à l'exec() shell d'AgentRunnerService. Conséquence assumée :
#     le module Services est non fonctionnel dans ce déploiement (hors périmètre CC-73).
#   - UN SEUL conteneur applicatif, jamais de replicas : les tâches de fond Leitner
#     et le balayage des ingestions orphelines au boot tournent DANS le processus.
#     Deux répliques se passeraient mutuellement leurs travaux en `failed`.
#
# Lancer (le drapeau --env-file est NÉCESSAIRE : il alimente l'interpolation
# ${...} du bloc postgres ci-dessous ; sans lui, postgres refuse de démarrer) :
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
#
# Construire l'image pour le NAS (amd64) au préalable :
#   docker build --platform linux/amd64 -t command-center:prod .
# =============================================================================

services:
  app:
    image: command-center:prod
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    # Injecte APP_KEY, DB_*, LLM_*, IMMICH_*, etc. DANS le conteneur.
    # (Distinct de --env-file, qui n'alimente que l'interpolation ${...} du compose.)
    env_file:
      - .env.production
    # La seule surface publiée : l'application, liée à 127.0.0.1 — seul le reverse
    # proxy DSM (qui joint localhost:8080) l'atteint. Sans ce préfixe, Docker
    # publierait sur 0.0.0.0 : l'application serait joignable de tout le réseau
    # local en HTTP nu — mots de passe et cookies de session en clair (CC-136 ;
    # APP_URL, désormais obligatoire, ne protège que contre l'usage prévu de ce
    # bind, pas contre un accès direct qui le contournerait) — et un client direct
    # pourrait forger son X-Forwarded-For (TRUST_PROXY=uniquelocal repose sur ce
    # bind, voir .env.production.example).
    ports:
      - '127.0.0.1:8080:8080'
    # Chemins FIXES dans le conteneur pour `node ace db:backup`/`db:restore` (CC-140), sur le
    # modèle exact de PGDATA_PATH ci-dessous : le CONTENEUR ne connaît que `/data/backups` et
    # `/data/backup-mirror`, jamais un chemin saisi ailleurs — seul le côté HÔTE du montage se
    # règle, une fois, ici.
    #
    # ⚠️ Le miroir n'a PAS de valeur par défaut, volontairement : un `${VAR:-...}` avec repli
    # ferait monter — et donc CRÉER côté hôte — un dossier réel dès que la variable est absente,
    # exactement la fausse sécurité que « le dossier doit exister, jamais le créer » interdit
    # ailleurs. Décommenter la ligne ET renseigner `BACKUP_MIRROR_DIR_PATH` pour activer le
    # miroir ; la laisser commentée = pas de miroir, détecté par l'absence du dossier dans le
    # conteneur (jamais créée en silence par ce compose).
    volumes:
      - '${BACKUP_DIR_PATH:-./backups}:/data/backups'
      # - '${BACKUP_MIRROR_DIR_PATH}:/data/backup-mirror'
      #
      # Déclaration des agents (CC-141) — lue au démarrage, jamais par une route. Absente :
      # module Agents vide, pas une erreur.
      #
      # ⚠️ SANS valeur par défaut inline, volontairement : un bind-mount Docker sur un fichier
      # source ABSENT crée un DOSSIER vide à cet emplacement au lieu de ne rien monter — l'app
      # lirait alors un dossier là où elle attend un fichier, et « module vide » deviendrait
      # silencieusement une erreur de format. Créer le fichier hôte (voir agents.json.example)
      # ET décommenter la ligne ; laissée commentée = pas d'agents, comme sans montage.
      # - '${AGENTS_CONFIG_PATH_HOST}:/data/agents.json'
      #
      # Socket Docker (module Services, CC-116/CC-141) — ⚠️ ÉQUIVALENT À ROOT SUR CETTE MACHINE,
      # cumulé à l'exec() shell d'AgentRunnerService ci-dessus (les deux tournent dans le même
      # conteneur). La décision CC-73 a refusé ce montage pour le NAS du propriétaire ; il reste
      # possible pour qui l'assume — lire la contrepartie EN TOUTES LETTRES dans
      # docs/deploiement-nas.md §11 avant de décommenter, pas seulement cette ligne.
      # - '/var/run/docker.sock:/var/run/docker.sock'
    depends_on:
      postgres:
        condition: service_healthy
    # Réaper PID 1 (récolte les zombies) ; le serveur reçoit bien SIGTERM.
    init: true
    restart: unless-stopped
    healthcheck:
      # /login est openRoute + guest → 200 pour un client non authentifié.
      # `node -e` + fetch : pas de dépendance à curl/wget dans l'image.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      # Laisse le temps aux migrations puis au premier démarrage.
      start_period: 40s
    networks:
      - command-center-network

  postgres:
    image: postgres:16-alpine
    # Nom FIXE : le cron de sauvegarde du NAS (docs/deploiement-nas.md) fait
    # `docker exec command-center-postgres pg_dump …` — sans ce nom, il dépendrait
    # du nom de projet compose (le dossier de lancement, un suffixe `-1`…) et le
    # script casserait au premier renommage.
    container_name: command-center-postgres
    # ⚠️ Résolus par interpolation depuis --env-file .env.production. Sans le
    # drapeau, ces variables sont vides et postgres REFUSE de démarrer (échec
    # bruyant, pas silencieux).
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # ⚠️ AUCUN `ports:` — voir l'en-tête. La base n'est jointe que par le réseau du compose.
    volumes:
      # Bind mount : les données vivent hors du cycle de vie des conteneurs. Sur le
      # NAS, renseigner PGDATA_PATH vers un chemin absolu
      # (ex. /volume1/docker/command-center/pgdata).
      # ⚠️ Ce dossier appartient à Postgres, lié à PG 16 ; ce n'est PAS une sauvegarde.
      - '${PGDATA_PATH:-./pgdata}:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - command-center-network

networks:
  command-center-network:
    driver: bridge
